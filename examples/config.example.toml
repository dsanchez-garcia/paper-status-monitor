# Example configuration for paper-status-monitor.
# Copy it to the default location (on Windows: %APPDATA%\paper-status-monitor\config.toml)
# or create your own with:  paper-status-monitor init
# Documentation: https://paper-status-monitor.readthedocs.io/en/latest/configuration.html

# Folder where one Excel workbook per manuscript and the change reports are stored.
# On Windows, use single quotes (literal strings) or forward slashes.
data_dir = '~/Documents/paper-status-monitor'

# Open the change report with your default text editor when something changes.
open_report = true

# Also write (and open) a report when a submission cannot be checked.
notify_on_errors = true

# Columns whose changes are recorded in the workbook but do not trigger a report.
ignore_fields = []

# Seconds to wait for each answer from the tracker.
request_timeout = 30

# One block per manuscript. The UUID below is the public demo submission served by
# the tracker (fictional data); replace it with the link from your own e-mail.
[[submissions]]
url = "https://track.authorhub.elsevier.com/?uuid=00000000-0000-0000-0000-000000000000"
label = "Demo submission"
enabled = true

