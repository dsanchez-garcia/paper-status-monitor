name: Contract test

# Every week, check that the tracker still answers in the format this package
# expects: the tests marked "network" (tests/test_contract.py) download the public
# demo submission. If they fail twice in a row, an issue labelled "contract-test" is
# opened, or commented if one is already open.

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays at 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Tracker contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"

      - name: Contract test
        id: first
        continue-on-error: true
        run: python -m pytest -m network -rA

      - name: Retry in 15 minutes (the tracker may be briefly unavailable)
        id: retry
        if: steps.first.outcome == 'failure'
        run: |
          sleep 900
          python -m pytest -m network -rA

      - name: Open or update an issue
        if: failure() && steps.retry.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label="contract-test"
          gh label create "$label" --color D93F0B --force \
            --description "The weekly test against the real tracker failed"
          number=$(gh issue list --state open --label "$label" --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "The contract test failed again: $RUN_URL"
            exit 0
          fi
          cat > issue.md <<EOF
          The weekly contract test against the real tracker failed twice, 15 minutes
          apart: $RUN_URL

          The tracker may have changed its data format, or the public demo submission
          changed. To investigate:

          1. Run \`python -m pytest -m network\` locally.
          2. Compare \`paper-status-monitor check 00000000-0000-0000-0000-000000000000 --json\`
             with \`tests/data/demo_submission.json\`.
          3. Adapt \`Snapshot.from_api\` in \`src/paper_status_monitor/models.py\` (and the
             stored copy of the demo record) if the format changed.

          Close this issue when the test passes again.
          EOF
          gh issue create --label "$label" --body-file issue.md \
            --title "Contract test failed: the tracker may have changed its data format"
